<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ペンギン・ランナー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="320" height="240"></canvas>
  <div id="sub">
    <span id="help">← → / A D：移動　Space / Z / ↑：ジャンプ（長押しで高く）　Shift / X：ダッシュ　M：音のオン/オフ</span>
    <button id="mute" tabindex="-1" aria-label="音のオン/オフ">🔊</button>
  </div>
  <div id="touch">
    <div class="pad">
      <button data-key="left">◀</button>
      <button data-key="right">▶</button>
    </div>
    <div class="pad">
      <button data-key="run">ダッシュ</button>
      <button data-key="jump">ジャンプ</button>
    </div>
  </div>
</div>
<script src="stages.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
